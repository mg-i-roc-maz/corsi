# Il negozio completo: avvialo con  docker compose up --build
# Dall'esterno si entra SOLO dal gateway: http://localhost:8080/api/v1/...
name: shop

services:
  catalog-db:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop}
      POSTGRES_DB: catalog
    volumes:
      - catalog-data:/var/lib/postgresql/data
      - ./services/catalog/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432" # facoltativo: serve solo per collegarsi dal tuo PC (test, client SQL)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d catalog"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  # Cache di catalog. Niente volume: una cache si può perdere, i dati veri sono in PostgreSQL.
  redis:
    image: redis:7.4
    # --save "" e --appendonly no: niente salvataggi su disco.
    # --maxmemory 64mb: quando è piena, Redis butta le chiavi usate meno di recente (allkeys-lru).
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  catalog:
    build: ./services/catalog
    environment:
      PORT: 3001
      DATABASE_URL: postgres://shop:${POSTGRES_PASSWORD:-shop}@catalog-db:5432/catalog
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Lezione 5: cache-aside su Redis
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      # Lezione 6: per quanti secondi gateway e browser possono tenere una risposta.
      HTTP_MAX_AGE_SECONDS: ${HTTP_MAX_AGE_SECONDS:-10}
      # Simula una query lenta (millisecondi per ogni lettura), per vedere l'effetto della cache.
      DB_DELAY_MS: ${DB_DELAY_MS:-100}
      # Esperimenti della lezione 4: catalog lento o inaffidabile.
      #   CHAOS_DELAY_MS=3000 docker compose up -d catalog
      CHAOS_DELAY_MS: ${CHAOS_DELAY_MS:-0}
      CHAOS_FAIL_PERCENT: ${CHAOS_FAIL_PERCENT:-0}
    # READINESS: catalog è "healthy" solo se risponde E il database risponde.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    # Se il processo termina (crash), Docker lo riavvia.
    restart: unless-stopped
    depends_on:
      catalog-db:
        condition: service_healthy
      # Basta che Redis sia avviato: catalog funziona anche senza cache.
      redis:
        condition: service_started

  orders:
    build: ./services/orders
    environment:
      PORT: 3002
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CATALOG_URL: http://catalog:3001
      # Resilienza verso catalog: tutto configurabile, niente numeri nel codice.
      CATALOG_TIMEOUT_MS: ${CATALOG_TIMEOUT_MS:-2000}
      CATALOG_RETRIES: ${CATALOG_RETRIES:-2}
      CATALOG_RETRY_BASE_MS: ${CATALOG_RETRY_BASE_MS:-100}
      BREAKER_ERROR_PERCENT: ${BREAKER_ERROR_PERCENT:-50}
      BREAKER_MIN_CALLS: ${BREAKER_MIN_CALLS:-5}
      BREAKER_RESET_MS: ${BREAKER_RESET_MS:-10000}
      BREAKER_WINDOW_MS: ${BREAKER_WINDOW_MS:-30000}
      # Lezione 6: cache locale dei prodotti e avvisi di catalog su Redis.
      CATALOG_CACHE_TTL_MS: ${CATALOG_CACHE_TTL_MS:-60000}
      REDIS_URL: redis://redis:6379
    # LIVENESS: orders è vivo anche se catalog non lo è.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    depends_on:
      catalog:
        condition: service_healthy
      redis:
        condition: service_started

  gateway:
    image: nginx:1.28
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      catalog:
        condition: service_healthy
      orders:
        condition: service_healthy

  # Lezione 6: k6, per i test di carico. Non parte con "up": si lancia a mano.
  #   docker compose run --rm k6 run /scripts/carico.js
  # Gira nella rete del Compose: raggiunge gateway e catalog per nome.
  k6:
    image: grafana/k6:1.0.0
    profiles: ["strumenti"]
    volumes:
      - ./k6:/scripts:ro

volumes:
  catalog-data:
