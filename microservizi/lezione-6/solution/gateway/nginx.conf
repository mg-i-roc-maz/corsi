# API Gateway del negozio: l'UNICO ingresso dall'esterno.
# Lezione 6: il gateway è anche una CACHE HTTP per le letture dei prodotti.
# Il browser parla solo con il gateway (porta 8080 del PC);
# catalog e orders non sono più raggiungibili direttamente.

events {}

http {
  # Un log per richiesta: chi ha chiesto cosa, a quale servizio è andata, quanto ci ha messo.
  # $request_id è un identificativo unico che nginx genera per ogni richiesta:
  # è il CORRELATION ID che seguirà la richiesta in tutti i servizi.
  log_format gateway '$request_id $remote_addr "$request" $status -> $upstream_addr $request_time s';
  access_log /dev/stdout gateway;
  error_log /dev/stderr warn;

  # Le risposte d'errore del gateway sono JSON, come quelle dei servizi.
  default_type application/json;

  # Anche il gateway ha bisogno di timeout: il default di nginx è 60 secondi.
  proxy_connect_timeout 2s;  # per aprire la connessione verso un servizio
  proxy_read_timeout 10s;    # per ricevere la risposta
  proxy_send_timeout 10s;

  # Ogni richiesta inoltrata porta il correlation ID ai servizi.
  proxy_set_header X-Request-Id $request_id;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  # CACHE HTTP del gateway (lezione 6).
  #   /var/cache/nginx/shop   dove tenere le copie, su disco
  #   keys_zone=products:10m  10 MB di memoria per l'indice delle chiavi (circa 80.000 chiavi)
  #   max_size=50m            al massimo 50 MB di copie: oltre, butta le meno usate
  #   inactive=10m            una copia non chiesta per 10 minuti viene buttata
  # Per QUANTO tenere una copia lo decide catalog, con Cache-Control: max-age.
  proxy_cache_path /var/cache/nginx/shop keys_zone=products:10m max_size=50m inactive=10m use_temp_path=off;

  server {
    listen 80;

    # Il gateway risponde da solo: serve a capire se è vivo.
    location = /health {
      return 200 '{"status":"ok","service":"gateway"}';
    }

    # Lo stato di salute dei servizi, visto da fuori (utile durante gli esperimenti).
    location = /health/catalog {
      proxy_pass http://catalog:3001/health/ready;
    }
    location = /health/orders {
      proxy_pass http://orders:3002/health/ready;
    }
    # Le statistiche della cache di catalog (hit, miss, hit ratio).
    location = /stats/cache {
      proxy_pass http://catalog:3001/cache/stats;
    }

    # Rotta INTERNA di catalog: la usa orders, non i clienti. Il gateway la blocca.
    # Le location con ~ (espressioni regolari) vincono su quelle a prefisso.
    location ~ ^/api/v1/products/[^/]+/reservations {
      return 403 '{"error":"Operazione non consentita"}';
    }

    # /api/v1/products...  ->  catalog:3001/products...
    # "catalog" è il nome del servizio in compose.yaml: lo risolve il DNS di Compose.
    location /api/v1/products {
      proxy_pass http://catalog:3001/products;
      # catalog risponde Location: /products/p-4; il cliente deve vedere l'indirizzo pubblico.
      proxy_redirect /products/ /api/v1/products/;

      # CACHE HTTP: si tengono solo le risposte GET e HEAD che catalog dichiara cacheable.
      proxy_cache products;
      # Lo stampede, lato gateway: se dieci richieste uguali arrivano mentre la copia
      # manca, UNA sola va a catalog; le altre aspettano la sua risposta.
      proxy_cache_lock on;
      proxy_cache_lock_timeout 5s;
      # Se catalog non risponde, meglio una copia scaduta che un errore.
      proxy_cache_use_stale error timeout http_500 http_502 http_503 updating;
      # Una copia scaduta viene rinnovata in sottofondo: il cliente non aspetta.
      proxy_cache_background_update on;
      # Rinnovare con If-None-Match: se non è cambiato, catalog risponde 304, pochi byte.
      proxy_cache_revalidate on;
      # Da dove arriva la risposta: HIT, MISS, EXPIRED, STALE, UPDATING, REVALIDATED.
      add_header X-Gateway-Cache $upstream_cache_status always;
      # Una risposta in cache porterebbe il correlation ID della PRIMA richiesta:
      # lo togliamo e mettiamo quello della richiesta di adesso.
      proxy_hide_header X-Request-Id;
      add_header X-Request-Id $request_id always;
    }

    # /api/v1/orders...  ->  orders:3002/orders...
    # Le statistiche della cache locale di orders (lezione 6).
    location = /stats/orders-cache {
      proxy_pass http://orders:3002/cache/stats;
    }

    location /api/v1/orders {
      proxy_pass http://orders:3002/orders;
      proxy_redirect /orders/ /api/v1/orders/;
    }

    # Il gateway non riesce a raggiungere un servizio (spento, nome sbagliato, troppo lento):
    # al posto della pagina HTML di nginx, un errore JSON. 502 = Bad Gateway.
    error_page 502 504 @non_raggiungibile;
    location @non_raggiungibile {
      return 502 '{"error":"Servizio non raggiungibile dal gateway"}';
    }

    # Tutto il resto: 404.
    location / {
      return 404 '{"error":"Risorsa non trovata"}';
    }
  }
}
