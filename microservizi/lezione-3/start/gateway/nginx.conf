# API Gateway del negozio: l'UNICO ingresso dall'esterno.
# Il browser parla solo con il gateway (porta 8080 del PC);
# catalog e orders non sono più raggiungibili direttamente.

events {}

http {
  # Un log per richiesta: chi ha chiesto cosa, a quale servizio è andata, quanto ci ha messo.
  log_format gateway '$remote_addr "$request" $status -> $upstream_addr $request_time s';
  access_log /dev/stdout gateway;
  error_log /dev/stderr warn;

  # Le risposte d'errore del gateway sono JSON, come quelle dei servizi.
  default_type application/json;

  server {
    listen 80;

    # Il gateway risponde da solo: serve a capire se è vivo.
    location = /health {
      return 200 '{"status":"ok","service":"gateway"}';
    }

    # Parte 3 · TODO 1: inoltra a catalog
    #   /api/v1/products...  ->  http://catalog:3001/products...
    # Con un percorso dopo l'indirizzo, nginx sostituisce il prefisso della location:
    #   location /api/v1/products { proxy_pass http://catalog:3001/products; }
    # Aggiungi anche:  proxy_redirect /products/ /api/v1/products/;
    # (corregge l'header Location che catalog restituisce dopo un POST)

    # Parte 3 · TODO 2: inoltra a orders, allo stesso modo
    #   /api/v1/orders...  ->  http://orders:3002/orders...

    # Parte 3 · TODO 3: blocca la rotta interna di catalog con un 403
    #   location ~ ^/api/v1/products/[^/]+/reservations { return 403 '{"error":"Operazione non consentita"}'; }
    # Prova prima SENZA questa location: cosa succede se un cliente chiama la rotta?

    # Il gateway non riesce a raggiungere un servizio (spento, nome sbagliato, troppo lento):
    # al posto della pagina HTML di nginx, un errore JSON. 502 = Bad Gateway.
    error_page 502 504 @non_raggiungibile;
    location @non_raggiungibile {
      return 502 '{"error":"Servizio non raggiungibile dal gateway"}';
    }

    # Tutto il resto: 404.
    location / {
      return 404 '{"error":"Risorsa non trovata"}';
    }
  }
}
