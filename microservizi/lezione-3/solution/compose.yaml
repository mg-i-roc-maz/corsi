# Il negozio completo: avvialo con  docker compose up --build
# Dall'esterno si entra SOLO dal gateway: http://localhost:8080/api/v1/...
name: shop

services:
  # Database del catalogo. Solo catalog lo usa: ogni servizio ha i suoi dati.
  catalog-db:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop}
      POSTGRES_DB: catalog
    volumes:
      - catalog-data:/var/lib/postgresql/data
      - ./services/catalog/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432" # facoltativo: serve solo per collegarsi dal tuo PC (test, client SQL)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d catalog"]
      interval: 2s
      timeout: 3s
      retries: 15

  catalog:
    build: ./services/catalog
    environment:
      PORT: 3001
      DATABASE_URL: postgres://shop:${POSTGRES_PASSWORD:-shop}@catalog-db:5432/catalog
    # Niente "ports": catalog è raggiungibile solo dentro la rete di Compose
    # (dal gateway e da orders), non dal tuo PC.
    depends_on:
      catalog-db:
        condition: service_healthy

  orders:
    build: ./services/orders
    environment:
      PORT: 3002
      # Service discovery: "catalog" è il nome del servizio qui sopra.
      CATALOG_URL: http://catalog:3001
    depends_on:
      - catalog

  # API Gateway: l'unico servizio con una porta pubblicata.
  gateway:
    image: nginx:1.28
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - catalog
      - orders

volumes:
  catalog-data:
