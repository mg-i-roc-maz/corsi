<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Lista Libri</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4">Lista Libri</h1>
        <form id="bookForm" class="row g-3 mb-4">
            <div class="col-md-5">
                <input type="text" class="form-control" id="title" placeholder="Titolo" required>
            </div>
            <div class="col-md-5">
                <input type="text" class="form-control" id="author" placeholder="Autore" required>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">Aggiungi</button>
            </div>
        </form>
        <ul class="list-group" id="bookList"></ul>
    </div>
    <!-- Script compilato da TypeScript -->
    <script src="main.js"></script>
</body>
</html>
