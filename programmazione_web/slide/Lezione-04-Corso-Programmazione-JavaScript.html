<h1 id="introduzione-a-javascript">Introduzione a JavaScript</h1>
<p>JavaScript è un linguaggio di programmazione nato nel 1995 per aggiungere interattività alle pagine web. Creato da Brendan Eich, è diventato uno standard del web, supportato da tutti i principali browser. JavaScript permette di manipolare il DOM, gestire eventi e comunicare con server tramite AJAX.</p>

<h2 id="statistiche-di-utilizzo-dei-linguaggi-di-programmazione-2004-2024">Statistiche di utilizzo dei linguaggi di programmazione (2004-2024)</h2>
<ul>
<li>Negli ultimi 20 anni, la popolarità dei linguaggi di programmazione è cambiata notevolmente.</li>
<li><strong>JavaScript</strong> è diventato il linguaggio più usato per lo sviluppo web.</li>
<li><strong>Python</strong> ha visto una crescita enorme grazie a data science, AI e automazione.</li>
<li><strong>Java</strong> e <strong>C#</strong> rimangono molto diffusi nello sviluppo enterprise.</li>
<li><strong>PHP</strong> ha perso terreno ma è ancora usato per il web.</li>
<li><strong>C/C++</strong> sono stabili, soprattutto in ambiti di sistema e embedded.</li>

<h2 id="tipi-di-dati-in-javascript">Tipi di dati in JavaScript</h2>

<li><strong>Null</strong>: valore intenzionalmente assente</li>
<li><strong>Undefined</strong>: variabile dichiarata ma non inizializzata</li>
<li><strong>Oggetti</strong>: collezioni di coppie chiave-valore</li>
<li><strong>Array</strong>: liste ordinate di valori</li>

<h2 id="operatori-principali">Operatori principali</h2>
<ul>
<li><strong>Aritmetici</strong>: <code>+</code>, <code>-</code>, <code>*</code>, <code>/</code>, <code>%</code></li>
<li><strong>Assegnamento</strong>: <code>=</code>, <code>+=</code>, <code>-=</code>, <code>*=</code>, <code>/=</code></li>
<li><strong>Confronto</strong>: <code>==</code>, <code>===</code>, <code>!=</code>, <code>!==</code>, <code>&lt;</code>, <code>&gt;</code>, <code>&lt;=</code>, <code>&gt;=</code></li>
<li><strong>Logici</strong>: <code>&amp;&amp;</code> (and), <code>||</code> (or), <code>!</code> (not)</li>
</ul>
<ul>
<li data-marpit-fragment="1">Nota sugli operatori === e !==:</li>
<li data-marpit-fragment="2">
<ul>
<li>L'operatore <code>===</code> (strettamente uguale) confronta sia il valore che il tipo delle due espressioni. Restituisce <code>true</code> solo se entrambi sono uguali e dello stesso tipo.</li>
</ul>
</li>
<li data-marpit-fragment="3">Esempio: <code>5 === '5'</code> restituisce <code>false</code>, mentre <code>5 === 5</code> restituisce <code>true</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-background-color="#fff" data-background-image="url('https://marp.app/assets/hero-background.svg')" data-style="section {

}
" lang="C" data-marpit-pagination="12" style="--paginate:true;--background-color:#fff;--background-image:url('https://marp.app/assets/hero-background.svg');--style:section {

}
;background-color:#fff;background-image:url('https://marp.app/assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="118">
<ul>
<li>
<ul>
<li>L'operatore <code>!==</code> (strettamente diverso) confronta sia il valore che il tipo delle due espressioni. Restituisce <code>true</code> solo se sono diversi o di tipo diverso.</li>
</ul>
</li>
<li>Esempio: <code>5 !== '5'</code> restituisce <code>true</code>, mentre <code>5 !== 5</code> restituisce <code>false</code>.</li>
<li>Questi operatori sono preferibili rispetto a <code>==</code> e <code>!=</code> perché evitano conversioni implicite di tipo rendendo il confronto più prevedibile e sicuro.</li>
</ul>
</section>

<h2 id="funzioni-arrow-funzioni-freccia">Funzioni arrow (funzioni freccia)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> <span class="hljs-title function_">moltiplica</span> = (<span class="hljs-params">x, y</span>) =&gt; x * y;
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-title function_">moltiplica</span>(<span class="hljs-number">2</span>, <span class="hljs-number">5</span>)); <span class="hljs-comment">// 10</span>
</code></pre>
<ul>
<li>Questa funzione è definita come arrow function (funzione freccia), una sintassi introdotta in ES6 che consente di scrivere funzioni in modo più conciso.</li>
<li>Le arrow function non hanno il proprio <code>this</code>, <code>arguments</code>, <code>super</code> o <code>new.target</code>, e sono spesso utilizzate per funzioni anonime o callback.</li>
<li>Utilizzare le arrow function può rendere il codice più leggibile e mantenere il contesto di <code>this</code> dalla funzione esterna.</li>
</ul>

<p>Entrambe devono restituire il quadrato del valore passato come argomento. Prova a chiamare entrambe le funzioni con il valore <code>5</code> e stampa il risultato in console.</p>

  <span class="hljs-keyword">return</span> x * x;
}

<span class="hljs-keyword">const</span> <span class="hljs-title function_">quadratoFreccia</span> = (<span class="hljs-params">x</span>) =&gt; x * x;

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-title function_">quadratoClassico</span>(<span class="hljs-number">5</span>)); <span class="hljs-comment">// 25</span>

<h3 id="differenza-del-this-tra-funzioni-classiche-e-arrow-function">Differenza del <code>this</code> tra funzioni classiche e arrow function</h3>
<ul>
<li>
<p><strong>Funzioni classiche</strong>: il valore di <code>this</code> dipende da come la funzione viene chiamata. Se usata come metodo di un oggetto, <code>this</code> fa riferimento all’oggetto stesso.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> persona = {
  <span class="hljs-attr">nome</span>: <span class="hljs-string">&quot;Luca&quot;</span>,
  <span class="hljs-attr">saluta</span>: <span class="hljs-keyword">function</span> (<span class="hljs-params"></span>) {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-variable language_">this</span>.<span class="hljs-property">nome</span>); <span class="hljs-comment">// &#x27;Luca&#x27;</span>
  },
};
persona.<span class="hljs-title function_">saluta</span>(); <span class="hljs-comment">// &#x27;Luca&#x27;</span>
</code></pre>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-background-color="#fff" data-background-image="url('https://marp.app/assets/hero-background.svg')" data-style="section {
  font-size: 2.1em;
}
" lang="C" data-marpit-pagination="23" style="--paginate:true;--background-color:#fff;--background-image:url('https://marp.app/assets/hero-background.svg');--style:section {
  font-size: 2.1em;
}
;background-color:#fff;background-image:url('https://marp.app/assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="118">
<ul>
<li>
<p><strong>Arrow function</strong>: non hanno il proprio <code>this</code>. Ereditano il <code>this</code> dal contesto esterno in cui sono state definite.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> persona = {
  <span class="hljs-attr">nome</span>: <span class="hljs-string">&quot;Luca&quot;</span>,
  <span class="hljs-attr">saluta</span>: <span class="hljs-function">() =&gt;</span> {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-variable language_">this</span>.<span class="hljs-property">nome</span>); <span class="hljs-comment">// undefined (non è l’oggetto persona)</span>
  },
};
persona.<span class="hljs-title function_">saluta</span>(); <span class="hljs-comment">// undefined</span>
</code></pre>
</li>
</ul>
<blockquote>
<p><strong>Nota:</strong> Usa funzioni classiche per i metodi degli oggetti quando serve accedere a <code>this</code>. Le arrow function sono utili per callback e funzioni anonime dove non serve un proprio <code>this</code>.</p>
</blockquote>
</section>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> persona = {

<blockquote>
<p><strong>Nota:</strong> In JavaScript, gli oggetti sono strutture fondamentali che permettono di raggruppare dati e funzionalità. Ogni oggetto è una collezione di coppie chiave-valore, dove le chiavi sono stringhe (o simboli) e i valori possono essere di qualsiasi tipo, incluse altre funzioni (metodi).</p>
</blockquote>

<h3 id="approfondimento-oggetti-javascript">Approfondimento: Oggetti JavaScript</h3>
<ul>
<li>Gli oggetti possono essere creati usando la notazione letterale <code>{}</code> oppure tramite costruttori come <code>new Object()</code>.</li>
<li>È possibile aggiungere, modificare o rimuovere proprietà anche dopo la creazione dell’oggetto.</li>
<li>Le proprietà possono essere accedute sia con la notazione punto (<code>oggetto.proprieta</code>) sia con la notazione con parentesi quadre (<code>oggetto['proprieta']</code>).</li>
</ul>
</section>

<p><strong>Esempio: aggiunta e accesso a proprietà e metodi</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> persona = {
  <span class="hljs-attr">nome</span>: <span class="hljs-string">&quot;Luca&quot;</span>,
  <span class="hljs-attr">eta</span>: <span class="hljs-number">30</span>,
  <span class="hljs-attr">saluta</span>: <span class="hljs-keyword">function</span> (<span class="hljs-params"></span>) {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Ciao, sono &quot;</span> + <span class="hljs-variable language_">this</span>.<span class="hljs-property">nome</span>);
  },
};

persona.<span class="hljs-property">cognome</span> = <span class="hljs-string">&quot;Rossi&quot;</span>; <span class="hljs-comment">// aggiunta di una nuova proprietà</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(persona[<span class="hljs-string">&quot;cognome&quot;</span>]); <span class="hljs-comment">// accesso tramite parentesi quadre</span>
persona.<span class="hljs-title function_">saluta</span>(); <span class="hljs-comment">// chiamata di un metodo</span>
</code></pre>
<ul>
<li>Gli oggetti sono alla base di molte strutture in JavaScript, inclusi array, funzioni e persino il DOM.</li>
<li>Comprendere bene gli oggetti è essenziale per scrivere codice JavaScript efficace e modulare.</li>
</ul>
</section>

<h2 id="sintassi-base-di-javascript">Sintassi base di JavaScript</h2>
<ul>
<li><strong>Dichiarazione di variabili</strong>:
<ul>
<li><code>var</code> è la parola chiave storica per dichiarare variabili. Ha ambito di funzione e può essere ridefinita.</li>
<li>Oggi si preferiscono <code>let</code> e <code>const</code> per una gestione più sicura dell'ambito delle variabili.</li>
</ul>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">var</span> messaggio = <span class="hljs-string">&quot;Ciao!&quot;</span>;
<span class="hljs-keyword">let</span> nome = <span class="hljs-string">&quot;Mario&quot;</span>;
<span class="hljs-keyword">const</span> eta = <span class="hljs-number">25</span>;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-background-color="#fff" data-background-image="url('https://marp.app/assets/hero-background.svg')" data-style="section {

" lang="C" data-marpit-pagination="39" style="--paginate:true;--background-color:#fff;--background-image:url('https://marp.app/assets/hero-background.svg');--style:section {

<h2 id="scope-di-var-let-e-const">Scope di var, let e const</h2>
<ul>
<li><strong><code>var</code></strong>: ha scope di funzione. Se dichiarata dentro una funzione, è visibile solo all'interno di essa; se dichiarata fuori, è globale. Non rispetta il blocco (<code>if</code>, <code>for</code>, ecc.).</li>
<li><strong><code>let</code></strong>: ha scope di blocco. È visibile solo all'interno del blocco in cui è dichiarata (ad esempio dentro <code>{ ... }</code>).</li>
<li><strong><code>const</code></strong>: come <code>let</code>, ha scope di blocco. Il valore non può essere riassegnato, ma se è un oggetto o array, le sue proprietà possono essere modificate.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-background-color="#fff" data-background-image="url('https://marp.app/assets/hero-background.svg')" data-style="section {

}
" lang="C" data-marpit-pagination="40" style="--paginate:true;--background-color:#fff;--background-image:url('https://marp.app/assets/hero-background.svg');--style:section {

}
;background-color:#fff;background-image:url('https://marp.app/assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="118">
<p><strong>Esempio:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">if</span> (<span class="hljs-literal">true</span>) {
  <span class="hljs-keyword">var</span> x = <span class="hljs-number">1</span>;
  <span class="hljs-keyword">let</span> y = <span class="hljs-number">2</span>;
  <span class="hljs-keyword">const</span> z = <span class="hljs-number">3</span>;
}
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(x); <span class="hljs-comment">// 1 (var esce dal blocco)</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(y); <span class="hljs-comment">// ReferenceError</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(z); <span class="hljs-comment">// ReferenceError</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">let</span> nome = <span class="hljs-string">&quot;Mario&quot;</span>;
<span class="hljs-keyword">const</span> eta = <span class="hljs-number">25</span>;
</code></pre>
</section>

<h2 id="hoisting-in-javascript">Hoisting in JavaScript</h2>
<ul>
<li><strong>Hoisting</strong> è il comportamento per cui le dichiarazioni di variabili e funzioni vengono &quot;spostate&quot; in cima al loro scope prima dell'esecuzione del codice.</li>
<li>Solo le dichiarazioni vengono hoistate, non le assegnazioni di valore.</li>
</ul>
<h3 id="hoisting-con-var">Hoisting con <code>var</code></h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(a); <span class="hljs-comment">// undefined</span>
<span class="hljs-keyword">var</span> a = <span class="hljs-number">5</span>;
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(a); <span class="hljs-comment">// 5</span>
</code></pre>
<blockquote>
<p>provate a stampare il valore di una variabile non definita e di una non assegnata</p>
</blockquote>
<ul>
<li>La dichiarazione <code>var a</code> viene spostata in cima, ma l'assegnazione avviene dove scritto.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-background-color="#fff" data-background-image="url('https://marp.app/assets/hero-background.svg')" data-style="section {

<h3 id="hoisting-con-let-e-const">Hoisting con <code>let</code> e <code>const</code></h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(b); <span class="hljs-comment">// ReferenceError</span>
<span class="hljs-keyword">let</span> b = <span class="hljs-number">10</span>;
</code></pre>
<ul>
<li>Le variabili dichiarate con <code>let</code> e <code>const</code> non sono accessibili prima della dichiarazione: generano un errore (TDZ - Temporal Dead Zone).</li>
</ul>
</section>

;background-color:#fff;background-image:url('https://marp.app/assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="118">
<h3 id="hoisting-delle-funzioni">Hoisting delle funzioni</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-title function_">saluta</span>(); <span class="hljs-comment">// &quot;Ciao!&quot;</span>
<span class="hljs-keyword">function</span> <span class="hljs-title function_">saluta</span>(<span class="hljs-params"></span>) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Ciao!&quot;</span>);
}
</code></pre>
<ul>
<li>Le dichiarazioni di funzione vengono completamente hoistate (sia nome che corpo).</li>
</ul>
</section>

" lang="C" data-marpit-pagination="44" style="--paginate:true;--background-color:#fff;--background-image:url('https://marp.app/assets/hero-background.svg');--style:section {
  font-size: 2.1em;

;background-color:#fff;background-image:url('https://marp.app/assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="118">
<h3 id="hoisting-delle-function-expression">Hoisting delle function expression</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-title function_">saluta</span>(); <span class="hljs-comment">// TypeError: saluta is not a function</span>
<span class="hljs-keyword">var</span> saluta = <span class="hljs-keyword">function</span> (<span class="hljs-params"></span>) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Ciao!&quot;</span>);
};

<h2 id="esercitazione-aggiunta-automatica-di-elementi-html">Esercitazione: Aggiunta automatica di elementi HTML</h2>
<p>Crea una pagina HTML con una lista <code>&lt;ul&gt;</code> vuota e un bottone &quot;Aggiungi elemento&quot;. Quando l’utente clicca sul bottone, aggiungi automaticamente un nuovo <code>&lt;li&gt;</code> alla lista con il testo &quot;Elemento X&quot;, dove X è il numero progressivo dell’elemento.</p>
<p><strong>Requisiti:</strong></p>
<ul>
<li>Ogni click sul bottone aggiunge un nuovo elemento alla lista.</li>
<li>Il testo di ogni elemento deve essere incrementale (&quot;Elemento 1&quot;, &quot;Elemento 2&quot;, ...).</li>
<li>Dopo aver aggiunto un elemento, stampa in console tutti i testi degli <code>&lt;li&gt;</code> presenti nella lista.</li>
</ul>
<p><strong>Suggerimento:</strong></p>
<blockquote>
<p>Usa <code>document.createElement</code>, <code>appendChild</code> e <code>querySelectorAll</code> per gestire la lista.<br />
Usa bottone.addEventListener(&quot;click&quot;, function () { ... }) per gestire il click sul bottone.</p>
</blockquote>

<h2 id="eventi-in-javascript">Eventi in JavaScript</h2>
<ul>
<li>Gli <strong>eventi</strong> sono azioni che accadono nella pagina web (click, pressione di tasti, caricamento, ecc.) e possono essere gestiti tramite JavaScript.</li>
<li>Gli eventi più comuni sono:
<ul>
<li><code>click</code> - <code>dblclick</code> - <code>mouseover</code> - <code>mouseout</code></li>
<li><code>mousedown</code> - <code>mouseup</code> - <code>mousemove</code> - <code>keydown</code>- <code>keyup</code> - <code>keypress</code></li>
<li><code>change</code> - <code>input</code> - <code>submit</code> - <code>focus</code> - <code>blur</code> - <code>load</code> - <code>resize</code></li>
<li><code>scroll</code>- <code>contextmenu</code></li>
<li><code>touchstart</code>, <code>touchend</code>, <code>touchmove</code> (mobile)</li>
</ul>
</li>
</ul>

<h2 id="focus-lespressione-regolare-per-la-password">Focus: L'espressione regolare per la password</h2>
<p>Nel codice di validazione password viene utilizzata questa espressione regolare:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> regex = <span class="hljs-regexp">/^(?=.*[A-Z])(?=.*\d).{8,}$/</span>;
<span class="hljs-comment">// Test della password</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(regex.<span class="hljs-title function_">test</span>(<span class="hljs-string">&quot;Password1&quot;</span>)); <span class="hljs-comment">// true</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(regex.<span class="hljs-title function_">test</span>(<span class="hljs-string">&quot;password&quot;</span>)); <span class="hljs-comment">// false</span>
</code></pre>
<p>Vediamo cosa significa:</p>
<ul>
<li><code>^</code> e <code>$</code> indicano l'inizio e la fine della stringa (la password deve rispettare tutta la regola).</li>
<li><code>(?=.*[A-Z])</code> richiede almeno una lettera maiuscola.</li>
<li><code>(?=.*\d)</code> richiede almeno una cifra numerica.</li>
<li><code>.{8,}</code> richiede almeno 8 caratteri di qualsiasi tipo.</li>
</ul>
</section>

La password è valida solo se contiene almeno 8 caratteri, almeno una lettera maiuscola e almeno un numero.</p>
<p><strong>Esempi:</strong></p>
<ul>
<li><code>&quot;Password1&quot;</code> <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> valida</li>

<li><code>&quot;PASSWORD1&quot;</code> <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> valida</li>
</ul>
<p>Le espressioni regolari sono strumenti potenti per validare stringhe secondo regole precise.</p>

<h3 id="soluzione-validazione-campi-input">Soluzione: Validazione campi input</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> form = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">getElementById</span>(<span class="hljs-string">&quot;mioForm&quot;</span>);
<span class="hljs-keyword">const</span> email = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">getElementById</span>(<span class="hljs-string">&quot;email&quot;</span>);
<span class="hljs-keyword">const</span> confermaEmail = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">getElementById</span>(<span class="hljs-string">&quot;confermaEmail&quot;</span>);
<span class="hljs-keyword">const</span> password = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">getElementById</span>(<span class="hljs-string">&quot;password&quot;</span>);
<span class="hljs-keyword">const</span> errori = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">getElementById</span>(<span class="hljs-string">&quot;errori&quot;</span>);

form.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&quot;submit&quot;</span>, <span class="hljs-keyword">function</span> (<span class="hljs-params">event</span>) {
  errori.<span class="hljs-property">innerHTML</span> = <span class="hljs-string">&quot;&quot;</span>;
  <span class="hljs-keyword">let</span> valido = <span class="hljs-literal">true</span>;

  <span class="hljs-comment">// Verifica campi obbligatori</span>
  <span class="hljs-keyword">if</span> (!email.<span class="hljs-property">value</span> || !confermaEmail.<span class="hljs-property">value</span> || !password.<span class="hljs-property">value</span>) {
    errori.<span class="hljs-property">innerHTML</span> += <span class="hljs-string">&quot;&lt;p&gt;Tutti i campi sono obbligatori.&lt;/p&gt;&quot;</span>;
    valido = <span class="hljs-literal">false</span>;
  }

  <span class="hljs-comment">// Verifica corrispondenza email</span>
  <span class="hljs-keyword">if</span> (email.<span class="hljs-property">value</span> !== confermaEmail.<span class="hljs-property">value</span>) {
    errori.<span class="hljs-property">innerHTML</span> += <span class="hljs-string">&quot;&lt;p&gt;Le email non corrispondono.&lt;/p&gt;&quot;</span>;
    valido = <span class="hljs-literal">false</span>;
  }

  <span class="hljs-comment">// Verifica complessità password</span>
  <span class="hljs-keyword">const</span> regex = <span class="hljs-regexp">/^(?=.*[A-Z])(?=.*\d).{8,}$/</span>;
  <span class="hljs-keyword">if</span> (!regex.<span class="hljs-title function_">test</span>(password.<span class="hljs-property">value</span>)) {
    errori.<span class="hljs-property">innerHTML</span> +=
      <span class="hljs-string">&quot;&lt;p&gt;La password deve avere almeno 8 caratteri, una maiuscola e un numero.&lt;/p&gt;&quot;</span>;
    valido = <span class="hljs-literal">false</span>;
  }

  <span class="hljs-keyword">if</span> (!valido) {
    event.<span class="hljs-title function_">preventDefault</span>();
  }
});
</code></pre>

<h2 id="cos%C3%A8-ajax-e-cosa-permette-di-fare">Cos'è AJAX e cosa permette di fare</h2>
<ul>
<li>AJAX (Asynchronous JavaScript and XML) è una tecnica che consente di inviare e ricevere dati dal server in modo asincrono, senza ricaricare la pagina.</li>
<li>Permette di aggiornare parti della pagina web dinamicamente, migliorando l'esperienza utente.</li>
<li>Non è un linguaggio, ma una combinazione di tecnologie: JavaScript, oggetti XMLHttpRequest o Fetch API, HTML/CSS e spesso dati in formato JSON.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="103" data-paginate="true" data-background-color="#fff" data-background-image="url('https://marp.app/assets/hero-background.svg')" data-style="section {

;background-color:#fff;background-image:url('https://marp.app/assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="118">
<h2 id="approfondimento-il-formato-json">Approfondimento: Il formato JSON</h2>
<ul>
<li><strong>JSON</strong> (JavaScript Object Notation) è un formato leggero per lo scambio di dati, molto usato nelle comunicazioni AJAX.</li>
<li>È facile da leggere e scrivere sia per le persone che per le macchine.</li>
<li>In JavaScript, puoi convertire un oggetto in JSON con <code>JSON.stringify()</code> e viceversa con <code>JSON.parse()</code>.</li>
</ul>
<p><strong>Esempio di oggetto JavaScript:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> persona = {
  <span class="hljs-attr">nome</span>: <span class="hljs-string">&quot;Mario&quot;</span>,
  <span class="hljs-attr">eta</span>: <span class="hljs-number">30</span>,
};
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="104" data-paginate="true" data-background-color="#fff" data-background-image="url('https://marp.app/assets/hero-background.svg')" data-style="section {
  font-size: 2.1em;
}
" lang="C" data-marpit-pagination="104" style="--paginate:true;--background-color:#fff;--background-image:url('https://marp.app/assets/hero-background.svg');--style:section {

;background-color:#fff;background-image:url('https://marp.app/assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="118">
<p><strong>Conversione in JSON:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> json = <span class="hljs-title class_">JSON</span>.<span class="hljs-title function_">stringify</span>(persona);
<span class="hljs-comment">// Risultato: &#x27;{&quot;nome&quot;:&quot;Mario&quot;,&quot;eta&quot;:30}&#x27;</span>
</code></pre>
<p><strong>Parsing da JSON a oggetto:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> oggetto = <span class="hljs-title class_">JSON</span>.<span class="hljs-title function_">parse</span>(json);
<span class="hljs-comment">// Risultato: { nome: &quot;Mario&quot;, eta: 30 }</span>
</code></pre>
<ul>
<li>JSON supporta tipi semplici: stringhe, numeri, booleani, array, oggetti e <code>null</code>.</li>
<li>È il formato più usato per scambiare dati tra client e server nelle applicazioni web moderne.</li>
<li>Attenzione: le chiavi e le stringhe devono essere racchiuse tra doppi apici (<code>&quot;</code>).</li>
</ul>
</section>

<p><strong>Esempio di file <code>dati.json</code>:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-json"><span class="hljs-punctuation">{</span>

<h2 id="cors-e-live-server-in-vs-code">CORS e Live Server in VS Code</h2>
<h3 id="cos%C3%A8-cors">Cos'è CORS?</h3>
<ul>
<li><strong>CORS</strong> (Cross-Origin Resource Sharing) è una politica di sicurezza dei browser che limita le richieste HTTP tra siti diversi (origini diverse).</li>
<li>Se una pagina web prova a richiedere dati da un dominio diverso, il browser blocca la richiesta a meno che il server non consenta esplicitamente l'accesso tramite intestazioni CORS.</li>
</ul>
<p><strong>Esempio di errore CORS:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Access to fetch at 'https://api.esterno.com/dati' from origin 'http://localhost:5500' has been blocked by CORS policy
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="107" data-paginate="true" data-background-color="#fff" data-background-image="url('https://marp.app/assets/hero-background.svg')" data-style="section {

;background-color:#fff;background-image:url('https://marp.app/assets/hero-background.svg');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="118">
<h3 id="live-server-in-vs-code">Live Server in VS Code</h3>
<ul>
<li><strong>Live Server</strong> è un'estensione di VS Code che avvia un server locale per testare le pagine web.</li>
<li>Serve i file tramite <code>http://localhost:5500</code> (o altra porta), simulando un ambiente reale.</li>
<li>Utile per evitare problemi di CORS quando si lavora in locale: molte API pubbliche consentono richieste da <code>localhost</code>.</li>
</ul>
<p><strong>Come usare Live Server:</strong></p>
<ol>
<li>Installa l'estensione &quot;Live Server&quot; da VS Code.</li>
<li>Clicca con il tasto destro su un file HTML e scegli &quot;Open with Live Server&quot;.</li>
<li>La pagina si aprirà nel browser su <code>localhost</code>.</li>
</ol>
<blockquote>
<p><strong>Nota:</strong> Se incontri errori CORS durante lo sviluppo, verifica che l'API supporti richieste da <code>localhost</code> o usa strumenti come proxy/CORS Anywhere solo per test locali.</p>
</blockquote>
</section>

<h2 id="struttura-di-una-richiesta-ajax">Struttura di una richiesta AJAX</h2>
<h3 id="xmlhttprequest">XMLHttpRequest</h3>
<ul>
<li>È il metodo &quot;storico&quot; per effettuare richieste AJAX.</li>
<li>Richiede più codice e gestione manuale degli stati della richiesta.</li>
</ul>
<p><strong>Esempio base:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> xhr = <span class="hljs-keyword">new</span> <span class="hljs-title class_">XMLHttpRequest</span>();
xhr.<span class="hljs-title function_">open</span>(<span class="hljs-string">&quot;GET&quot;</span>, <span class="hljs-string">&quot;https://jsonplaceholder.typicode.com/posts/1&quot;</span>);
xhr.<span class="hljs-property">onload</span> = <span class="hljs-keyword">function</span> (<span class="hljs-params"></span>) {
  <span class="hljs-keyword">if</span> (xhr.<span class="hljs-property">status</span> === <span class="hljs-number">200</span>) {
    <span class="hljs-keyword">const</span> dati = <span class="hljs-title class_">JSON</span>.<span class="hljs-title function_">parse</span>(xhr.<span class="hljs-property">responseText</span>);
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Titolo:&quot;</span>, dati.<span class="hljs-property">title</span>);
  }
};
xhr.<span class="hljs-title function_">send</span>();
</code></pre>
<ul>
<li>Bisogna gestire manualmente gli eventi come <code>onload</code>, <code>onerror</code>, ecc.</li>
</ul>
</section>

</ul>
<p><strong>Esempio base:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-title function_">fetch</span>(<span class="hljs-string">&quot;https://jsonplaceholder.typicode.com/posts/1&quot;</span>)
  .<span class="hljs-title function_">then</span>(<span class="hljs-function">(<span class="hljs-params">response</span>) =&gt;</span> response.<span class="hljs-title function_">json</span>())
  .<span class="hljs-title function_">then</span>(<span class="hljs-function">(<span class="hljs-params">dati</span>) =&gt;</span> {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Titolo:&quot;</span>, dati.<span class="hljs-property">title</span>);
  });
</code></pre>
<ul>
<li>Gestione più semplice degli errori e delle risposte asincrone.</li>
<li>Supporta anche le richieste POST, PUT, DELETE, ecc.</li>
</ul>
</section>

<h2 id="introduzione-alle-promise-in-javascript">Introduzione alle Promise in JavaScript</h2>
<ul>
<li>Una <strong>Promise</strong> è un oggetto che rappresenta il risultato futuro di un'operazione asincrona.</li>
<li>Permette di gestire codice asincrono in modo più leggibile rispetto alle callback tradizionali.</li>
<li>Una Promise può essere in tre stati:
<ul>
<li><strong>pending</strong> (in attesa)</li>
<li><strong>fulfilled</strong> (risolta)</li>
<li><strong>rejected</strong> (rifiutata)</li>
</ul>
</li>
</ul>
</section>

<h2 id="sintassi-base-delle-promise">Sintassi base delle Promise</h2>
<p><strong>Creazione di una Promise:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> promessa = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Promise</span>(<span class="hljs-function">(<span class="hljs-params">resolve, reject</span>) =&gt;</span> {
  <span class="hljs-comment">// Operazione asincrona</span>
  <span class="hljs-keyword">if</span> (<span class="hljs-comment">/* tutto ok */</span>) {
    <span class="hljs-title function_">resolve</span>(<span class="hljs-string">&#x27;Risultato&#x27;</span>);
  } <span class="hljs-keyword">else</span> {
    <span class="hljs-title function_">reject</span>(<span class="hljs-string">&#x27;Errore&#x27;</span>);
  }
});
</code></pre>
</section>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript">promessa

<h2 id="esercizio-riepilogativo-mini-app-di-gestione-lista">Esercizio riepilogativo: Mini-app di gestione lista</h2>
<p>Crea una semplice pagina HTML con una lista di elementi <code>&lt;ul&gt;</code> e un campo di input con un bottone &quot;Aggiungi&quot;. Scrivi il codice JavaScript che:</p>
<ol>
<li>Permette all’utente di inserire un nuovo elemento nella lista digitando il testo nell’input e cliccando il bottone.</li>
<li>Evidenzia tutti gli elementi della lista con uno sfondo giallo quando vengono cliccati.</li>
<li>Recupera tutti gli elementi della lista e li stampa in console come array di stringhe.</li>
</ol>
